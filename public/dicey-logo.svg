<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1336" />
      <stop offset="100%" stop-color="#140d24" />
    </linearGradient>
    <linearGradient id="top-face" x1="140" y1="100" x2="372" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="left-face" x1="116" y1="186" x2="256" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b2363" />
      <stop offset="100%" stop-color="#231738" />
    </linearGradient>
    <linearGradient id="right-face" x1="256" y1="186" x2="396" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#2e184f" />
    </linearGradient>
    <radialGradient id="pip-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a3ff7a" />
      <stop offset="60%" stop-color="#39ff14" />
      <stop offset="100%" stop-color="#22c55e" />
    </radialGradient>
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect x="6" y="6" width="500" height="500" rx="106" stroke="#a855f7" stroke-opacity="0.22" stroke-width="4" />

  <!-- Isometric Rounded Die -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- Top Face -->
    <path d="M256 104 L388 180 L256 256 L124 180 Z" fill="url(#top-face)" stroke="#d8b4fe" stroke-opacity="0.45" stroke-width="4" />
    <!-- Left Face -->
    <path d="M124 180 L256 256 L256 408 L124 332 Z" fill="url(#left-face)" stroke="#453066" stroke-width="4" />
    <!-- Right Face -->
    <path d="M388 180 L256 256 L256 408 L388 332 Z" fill="url(#right-face)" stroke="#6b21a8" stroke-opacity="0.6" stroke-width="4" />
  </g>

  <!-- Crisp Inner Edge Highlight -->
  <path d="M128 182 L256 256 L384 182" stroke="#e9d5ff" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round" />
  <path d="M256 256 L256 404" stroke="#a855f7" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round" />

  <!-- Electric Green Pips -->
  <g filter="url(#neon-glow)">
    <!-- Top face: 1 pip (center) -->
    <ellipse cx="256" cy="180" rx="22" ry="13" fill="url(#pip-glow)" />

    <!-- Left face: 2 pips (diagonal) -->
    <ellipse cx="164" cy="242" rx="14" ry="19" transform="rotate(-28 164 242)" fill="url(#pip-glow)" />
    <ellipse cx="216" cy="346" rx="14" ry="19" transform="rotate(-28 216 346)" fill="url(#pip-glow)" />

    <!-- Right face: 3 pips (diagonal) -->
    <ellipse cx="352" cy="242" rx="13" ry="18" transform="rotate(28 352 242)" fill="url(#pip-glow)" />
    <ellipse cx="322" cy="294" rx="13" ry="18" transform="rotate(28 322 294)" fill="url(#pip-glow)" />
    <ellipse cx="292" cy="346" rx="13" ry="18" transform="rotate(28 292 346)" fill="url(#pip-glow)" />
  </g>
</svg>
